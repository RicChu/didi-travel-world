<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4eee3">
<title>2026 土耳其 9 日 · 行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 配色：地毯紅為主，綠松石為輔，銅金點綴 */
  --ink:#2e1a1f; --muted:#756467;
  --paper:#f4eee3; --paper-strong:#e8dfd1; --card:#fffcf6;
  --teal:#2f6e74; --teal-soft:#dfecec;
  --terra:#6e2230; --terra-soft:#f3e0e2; --terra-ink:#6e2230;
  --gold:#c49a3f; --gold-soft:#f7edd4; --gold-ink:#7e6322;
  /* 由主色衍生出來的次要色：集中在這裡，換配色時才不會有寫死的顏色換不到 */
  --on-dark:#fdf6ec;        /* 深色底上的字 */
  --hero-a:rgba(80,24,35,.97); --hero-b:rgba(168,83,58,.86);
  --scrim:rgba(66,20,29,.64); --scrim-strong:rgba(66,20,29,.78);
  --shade-1:rgba(66,20,29,.88); --shade-2:rgba(66,20,29,.55); --shade-3:rgba(66,20,29,.12);
  --kicker:#e0bda0; --warm:#d9a05c;
  --pill:#c49a3f; --pill-on:#a8533a;
  --ink-soft:#5e4a4e; --ink-body:#54474a; --ink-note:#5f5053; --ink-sub:#452f34;
  --dot:#c4b4b6; --bar-stay:#d6c9ca; --fly:#2f5d8f;
  --stroke:#e3c08d;
  --wash-a:rgba(110,34,48,.10); --wash-b:rgba(47,110,116,.08);
  --focus:rgba(110,34,48,.38);
  --tint:rgba(47,110,116,.08); --tint-soft:rgba(47,110,116,.05);
  --edge:rgba(47,110,116,.28); --sight-bg:rgba(223,236,236,.5);
  --edge-gold:rgba(196,154,63,.42); --eatery-bg:rgba(247,237,212,.45);
  --line:rgba(46,26,31,.14);
  --shadow:0 20px 55px rgba(61,34,38,.12);
  --row-display:grid;        /* 時間軸列的版型：手機版在 media query 裡改成 block */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --serif:Georgia,"Noto Serif TC","Songti TC",serif;
  font-family:"DM Sans","Noto Sans TC","PingFang TC",sans-serif;
  color:var(--ink); background:var(--paper); font-synthesis:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0; min-width:320px; line-height:1.6; -webkit-text-size-adjust:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 87% 8%, var(--wash-a), transparent 23rem),
    radial-gradient(circle at 10% 44%, var(--wash-b), transparent 26rem),
    var(--paper);
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
strong{font-weight:700}

.page-shell{width:min(1160px,calc(100% - 32px));margin:0 auto}

/* ---------- 返回列 ---------- */
.app-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(var(--safe-t) + 14px) 0 0}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:999px;
  color:var(--teal);background:rgba(255,253,248,.7);border:1px solid var(--line);
  font-size:.85rem;font-weight:600;text-decoration:none;
}
.back-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.topbar-title{font-size:.72rem;font-weight:700;letter-spacing:.19em;color:var(--muted)}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;min-height:430px;margin-top:14px;padding:34px 42px 28px;border-radius:28px;
  color:var(--on-dark);box-shadow:var(--shadow);
  /* 封面照片＋主題色漸層：左側壓暗讓字清楚，右側透出照片；照片載入失敗時退回純漸層 */
  background:
    linear-gradient(100deg,var(--shade-1) 0%,var(--shade-2) 48%,var(--shade-3) 100%),
    linear-gradient(0deg,var(--shade-2) 0%,transparent 38%),
    url('../img/turkey-cover.jpg') center 52%/cover no-repeat,
    linear-gradient(125deg,var(--hero-a),var(--hero-b)),var(--teal);
}
.hero-topline,.hero-copy,.route-line{position:relative;z-index:1}
.hero-topline{display:flex;align-items:center;justify-content:space-between;gap:16px}
.eyebrow,.section-label{font-size:.73rem;font-weight:700;letter-spacing:.19em}
.live-pill{
  display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:99px;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);font-size:.76rem;text-align:right;
}
.live-pill i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--pill);box-shadow:0 0 0 4px rgba(217,184,110,.12)}
.live-pill.on i{background:var(--pill-on);box-shadow:0 0 0 4px rgba(240,138,103,.18);animation:pulse 1.9s ease-out infinite}
.hero-copy{display:flex;justify-content:space-between;align-items:end;gap:40px;margin-top:76px}
.hero-kicker{margin:0 0 11px;color:var(--kicker);font-size:.9rem;letter-spacing:.08em}
h1{text-shadow:0 2px 18px rgba(0,0,0,.25)}
.hero .eyebrow,.hero-kicker,.hero-who,.route-line,.live-pill{text-shadow:0 1px 6px rgba(0,0,0,.45)}
h1{margin:0;max-width:700px;font-family:var(--serif);font-weight:500;font-size:clamp(2.5rem,5.4vw,4.7rem);line-height:1.02;letter-spacing:-.04em}
.hero-who{margin:14px 0 0;color:rgba(255,250,241,.72);font-size:.85rem}
.hero-stats{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(2,minmax(75px,1fr));gap:1px;overflow:hidden;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);border-radius:16px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.hero-stats button{
  display:flex;align-items:baseline;justify-content:center;gap:5px;min-width:104px;padding:14px 12px;
  border:0;color:var(--on-dark);background:rgba(66,20,29,.42);cursor:pointer;transition:background .2s ease;
}
.hero-stats button:hover{background:rgba(66,20,29,.62)}
.hero-stats strong{font-size:1.4rem}
.hero-stats span{color:rgba(255,255,255,.7);font-size:.75rem}
.route-line{display:flex;align-items:center;gap:12px;margin-top:54px;color:rgba(255,255,255,.75);font-size:.82rem;white-space:nowrap}
.route-line i{flex:1;height:1px;background:rgba(255,255,255,.22)}

/* ---------- 區塊標題 ---------- */
main{padding:78px 0 44px}
section+section{margin-top:96px}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
.section-label{margin:0 0 9px;color:var(--terra)}
h2{margin:0;font-family:var(--serif);font-size:clamp(2rem,4vw,3.25rem);font-weight:500;letter-spacing:-.04em}
.legend{display:flex;gap:16px;color:var(--muted);font-size:.8rem}
.legend span{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.k-sight{background:var(--teal)} .dot.k-move{background:var(--gold)} .dot.k-eat{background:var(--terra)}

/* ---------- 日期滑軌 ---------- */
.date-rail-wrap{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:10px;align-items:center}
.date-rail{position:relative;display:flex;gap:8px;overflow-x:auto;padding:5px;scrollbar-width:none;scroll-snap-type:x proximity}
.date-rail::-webkit-scrollbar{display:none}
.date-tab{
  position:relative;flex:0 0 83px;scroll-snap-align:center;padding:11px 8px;cursor:pointer;
  border:1px solid var(--line);border-radius:14px;background:rgba(255,253,248,.58);transition:.2s ease;
}
.date-tab span,.date-tab small{display:block}
.date-tab span{font-weight:700;font-size:.9rem}
.date-tab small{margin-top:3px;color:var(--muted);font-size:.7rem}
.date-tab.active{color:#fff;border-color:var(--teal);background:var(--teal);transform:translateY(-2px);box-shadow:0 10px 24px rgba(35,77,73,.2)}
.date-tab.active small{color:rgba(255,255,255,.7)}
.date-tab.today::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--terra);animation:pulse 1.9s ease-out infinite}
.rail-arrow{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:transparent;cursor:pointer;transition:.2s ease}
.rail-arrow:hover:not(:disabled){color:#fff;border-color:var(--teal);background:var(--teal)}
.rail-arrow:disabled{opacity:.25;cursor:not-allowed}

/* ---------- 當日面板 ---------- */
.dp{margin-top:22px;padding:30px;border:1px solid rgba(30,42,42,.08);border-radius:24px;background:rgba(255,253,248,.88);box-shadow:var(--shadow);scroll-margin-top:16px}
.dp[hidden]{display:none}
.dp.today{border-color:rgba(191,98,68,.35)}
.dp-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start;padding-bottom:24px;border-bottom:1px solid var(--line)}
.day-number{color:var(--terra);font-size:.74rem;font-weight:700;letter-spacing:.16em}
.dp h3{margin:7px 0 4px;font-family:var(--serif);font-weight:500;font-size:clamp(1.55rem,3vw,2.3rem);line-height:1.2;letter-spacing:-.02em}
.dp-sub{margin:0 0 10px;color:var(--teal);font-weight:600;font-size:.95rem}
.day-summary{margin:0;color:var(--muted);line-height:1.75;font-size:.95rem}
.day-summary strong{color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.fact{padding:5px 10px;border-radius:999px;font-size:.75rem;font-weight:600;color:var(--teal);background:var(--teal-soft)}
.fact.warn{color:var(--terra-ink);background:var(--terra-soft)}
.note-box{min-width:170px;padding:14px 16px;border-radius:13px;background:var(--teal-soft)}
.note-box strong,.note-box small{display:block}
.note-box strong{font-size:.72rem;letter-spacing:.12em;color:var(--ink-soft)}
.note-box .stars{display:block;margin-top:4px;font-size:1rem;letter-spacing:.1em;color:var(--terra)}
.note-box small{margin-top:2px;color:var(--ink-sub);font-size:.8rem;line-height:1.45}
.dp-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.live-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:.68rem;font-weight:700;color:var(--terra-ink);background:var(--terra-soft)}
.live-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--terra);animation:pulse 1.9s ease-out infinite}

.day-hero{position:relative;margin-top:24px;border-radius:18px;overflow:hidden;background:var(--paper-strong)}
.day-hero img{width:100%;aspect-ratio:16/9;object-fit:cover}
.hero-cap{position:absolute;left:12px;bottom:12px;padding:5px 10px;border-radius:999px;font-size:.72rem;color:var(--on-dark);background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.dp-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.sw{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.42)}
.sw-lab{padding:0 8px 0 10px;font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--terra)}
.sw-btn{padding:8px 13px;border:0;border-radius:999px;color:var(--muted);background:transparent;cursor:pointer;font-size:.8rem}
.sw-btn.on{color:#fff;background:var(--teal)}
.sw-btn[disabled]{opacity:.35;cursor:not-allowed;text-decoration:line-through}

/* 情境切換：只顯示符合目前選項的列與區塊 */
.tl-row[data-sc],.grp[data-sc]{display:none}
/* 第二層切換（sw2／data-sc2）：與第一層獨立，同樣要在下面登記鍵名 */
.tl-row[data-sc2]{display:none}
.dp[data-sc2="kofte"] .tl-row[data-sc2~="kofte"]:not([data-sc]),
.dp[data-sc2="poika"] .tl-row[data-sc2~="poika"]:not([data-sc]){display:var(--row-display)}
/* 同時掛 sc 與 sc2 的列：兩層都要對上才顯示 */
.tl-row[data-sc][data-sc2]{display:none}
.dp[data-sc="sul"][data-sc2="kofte"] .tl-row[data-sc~="sul"][data-sc2~="kofte"],
.dp[data-sc="gulhane"][data-sc2="kofte"] .tl-row[data-sc~="gulhane"][data-sc2~="kofte"],
.dp[data-sc="topkapi"][data-sc2="kofte"] .tl-row[data-sc~="topkapi"][data-sc2~="kofte"],
.dp[data-sc="sul"][data-sc2="poika"] .tl-row[data-sc~="sul"][data-sc2~="poika"],
.dp[data-sc="gulhane"][data-sc2="poika"] .tl-row[data-sc~="gulhane"][data-sc2~="poika"],
.dp[data-sc="topkapi"][data-sc2="poika"] .tl-row[data-sc~="topkapi"][data-sc2~="poika"]{display:var(--row-display)}
/* 情境鍵：新增 sw 選項時要同步加進下面兩行，否則該群組永遠不顯示 */
.dp[data-sc="done"] .tl-row[data-sc~="done"]:not([data-sc2]),.dp[data-sc="fly"] .tl-row[data-sc~="fly"]:not([data-sc2]),.dp[data-sc="no"] .tl-row[data-sc~="no"]:not([data-sc2]),
.dp[data-sc="go"] .tl-row[data-sc~="go"]:not([data-sc2]),.dp[data-sc="skip"] .tl-row[data-sc~="skip"]:not([data-sc2]),
.dp[data-sc="sul"] .tl-row[data-sc~="sul"]:not([data-sc2]),.dp[data-sc="topkapi"] .tl-row[data-sc~="topkapi"]:not([data-sc2]),
.dp[data-sc="gulhane"] .tl-row[data-sc~="gulhane"]:not([data-sc2]){display:var(--row-display)}
.dp[data-sc="done"] .grp[data-sc~="done"],.dp[data-sc="fly"] .grp[data-sc~="fly"],.dp[data-sc="no"] .grp[data-sc~="no"],
.dp[data-sc="go"] .grp[data-sc~="go"],.dp[data-sc="skip"] .grp[data-sc~="skip"],
.dp[data-sc="sul"] .grp[data-sc~="sul"],.dp[data-sc="topkapi"] .grp[data-sc~="topkapi"],
.dp[data-sc="gulhane"] .grp[data-sc~="gulhane"]{display:block}

/* ---------- 時間軸 ---------- */
.grp{margin-top:26px}
.grp-head{display:flex;align-items:baseline;gap:10px;margin:0 0 4px 82px}
.grp-head b{font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--terra)}
.grp-head span{font-size:.75rem;color:var(--muted)}
.grp.alt .grp-head b{color:var(--gold)}
.tl{position:relative;display:grid;gap:12px;margin:18px 0 0;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:63px;top:20px;bottom:20px;width:1px;background:var(--line)}
/* 交通方式色條：疊在時間軸那條線上，顏色由 data-way 決定 */
.tl-row[data-way]::before{content:"";position:absolute;left:61px;top:0;bottom:-12px;width:5px;border-radius:999px;
  box-shadow:0 0 0 1.5px var(--card),0 2px 5px rgba(28,40,38,.22)}
.tl-row[data-way="fly"]::before{background:var(--fly)}
.tl-row[data-way="drive"]::before{background:var(--terra)}
.tl-row[data-way="walk"]::before{background:var(--gold)}
.tl-row[data-way="transit"]::before{background:var(--teal)}
.tl-row[data-way="stay"]::before{background:var(--bar-stay)}
.tl-row{display:grid;grid-template-columns:50px minmax(0,1fr);gap:32px;position:relative}
.tl-time{padding-top:15px;color:var(--muted);font-size:.74rem;font-weight:700;line-height:1.35;text-align:right;font-variant-numeric:tabular-nums}
.tl-card{position:relative;border:1px solid var(--line);border-radius:15px;background:var(--card);transition:border-color .2s ease,box-shadow .2s ease}
.tl-card::before{
  content:"";position:absolute;left:-26px;top:19px;width:9px;height:9px;border:3px solid var(--card);border-radius:50%;
  background:var(--dot);box-shadow:0 0 0 1px var(--dot);
}
.tl-card.k-sight::before{background:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.tl-card.k-move::before{background:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tl-card.k-eat::before{background:var(--terra);box-shadow:0 0 0 1px var(--terra)}
/* 有交通方式的列：圓點換成帶 emoji 的圓章，外圈顏色＝該交通方式的色條顏色 */
.tl-row[data-way]:not([data-way="stay"]) .tl-card::before,
.tl-row[data-mark] .tl-card::before{
  box-sizing:border-box;left:-30px;top:15px;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--card);border-radius:50%;
  background:var(--card);font-size:11px;line-height:1;
}
/* 沒有交通方式的停留列：圓章外圈用灰色 */
.tl-row[data-mark] .tl-card::before{box-shadow:0 0 0 1.5px var(--dot)}
.tl-row[data-way="fly"] .tl-card::before{content:"\2708\FE0F";box-shadow:0 0 0 1.5px var(--fly)}
.tl-row[data-way="drive"] .tl-card::before{content:"\1F698";box-shadow:0 0 0 1.5px var(--terra)}
.tl-row[data-way="walk"] .tl-card::before{content:"\1F6B6";box-shadow:0 0 0 1.5px var(--gold)}
.tl-row[data-way="transit"] .tl-card::before{content:"\1F68B";box-shadow:0 0 0 1.5px var(--teal)}
/* 類型 emoji 覆蓋交通 emoji；外圈顏色仍沿用該列的交通方式 */
.tl-row[data-mark="hotel"] .tl-card::before{content:"\1F3E8"}
.tl-row[data-mark="eat"] .tl-card::before{content:"\1F37D\FE0F"}
.tl-row[data-mark="sight"] .tl-card::before{content:"\1F4CD"}
details.tl-card[open]{border-color:var(--edge);box-shadow:0 8px 20px rgba(35,77,73,.07)}
.tl-sum{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;list-style:none}
details .tl-sum{cursor:pointer}
.tl-sum::-webkit-details-marker{display:none}
.tl-head{min-width:0}
.tl-act{font-weight:600;line-height:1.45}
.tl-row.hi .tl-act{font-weight:700}
.tl-side{flex:0 0 auto;display:flex;align-items:center;gap:6px;margin-top:1px}
.tl-pill{padding:5px 8px;border-radius:999px;font-size:.67rem;font-weight:700;white-space:nowrap}
.tl-pill.k-sight{color:var(--teal);background:var(--teal-soft)}
.tl-pill.k-move{color:var(--gold-ink);background:var(--gold-soft)}
.tl-pill.k-eat{color:var(--terra-ink);background:var(--terra-soft)}
.chev{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
details[open] .chev{transform:rotate(180deg)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{padding:4px 8px;border-radius:7px;font-size:.72rem;line-height:1.3;color:var(--ink-soft);background:var(--tint)}
.tag.car{color:var(--gold-ink);background:var(--gold-soft)}
.tag.warn,.tag.lock{color:var(--terra-ink);background:var(--terra-soft);font-weight:600}
.tl-body{padding:0 16px 16px;color:var(--ink-body);font-size:.92rem;line-height:1.75}
/* 說明文字要比列標題 .tl-act 小一級，不要看起來像標題 */
.tl-note{font-size:.84rem;line-height:1.72;color:var(--ink-note)}
.tl-note strong{color:var(--ink)}

/* 現在進行中 */
.tl-row.now .tl-time{color:var(--terra)}
.tl-row.now .tl-time::after{content:"現在";display:block;margin-top:3px;font-size:.7rem;letter-spacing:.06em}
.tl-row.now.up .tl-time::after{content:"即將開始";color:var(--muted);letter-spacing:0}
.tl-row.now .tl-card{border-color:rgba(191,98,68,.5);box-shadow:0 8px 22px rgba(191,98,68,.12)}
.tl-row.now .tl-card::before{background:var(--terra);box-shadow:0 0 0 1px var(--terra);animation:ring 1.9s ease-out infinite}
.tl-row.now.up .tl-card::before{animation:none;background:#fff}

/* 景點說明 */
/* 單一景點卡：跟餐廳卡一樣直接展開，不用再點一次 */
.sightc{margin-top:12px;overflow:hidden;border:1px solid var(--edge);border-radius:14px;background:var(--sight-bg)}
.sightc-fig{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--paper-strong)}
.sightc-body{padding:13px 14px 14px}
.sightc-name{font-family:var(--serif);font-size:1.12rem;line-height:1.3;color:var(--ink)}
.sightc-en{display:block;margin-top:2px;font-family:"DM Sans","Noto Sans TC",sans-serif;font-size:.74rem;color:var(--muted)}
.sightc-d{margin-top:9px;font-size:.88rem;line-height:1.75}
/* sight 加 side:true → 文字在左、圖片在右 */
/* side 版：沒有卡片外框與底色，只有描述文字＋右邊一張有框的圖 */
.sightc.side{display:flex;align-items:stretch;gap:12px;border:0;border-radius:0;background:transparent;overflow:visible}
.sightc.side .sightc-name{display:none}
.sightc.side .sightc-body{order:1;flex:1 1 auto;min-width:0;align-self:center;padding:0}
.sightc.side .sightc-d{margin-top:0;font-size:.86rem;line-height:1.7}
.sightc.side+.tags{display:flex;margin-top:11px}
/* 卡片內容的第一個元素是標籤時（整列只有標籤），上面不用再留間距 */
.tl-body>.tags:first-child{margin-top:0}
.sightc.side .sightc-fig{order:2;flex:0 0 40%;width:40%;min-width:96px;max-width:240px;align-self:stretch;border:1px solid var(--edge);border-radius:12px}
.tl-spots{margin-top:12px;padding:12px;border-radius:13px;background:var(--tint-soft)}
.spots-head{margin-bottom:8px;font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--teal)}
.spot{display:flex;align-items:center;gap:10px;width:100%;margin-top:6px;padding:10px 12px;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.spot.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.spot-no{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:.75rem;font-weight:700;color:#fff;background:var(--teal)}
.spot-no.way{color:var(--teal);background:var(--teal-soft)}
.spot-txt{flex:1;min-width:0;font-weight:600;font-size:.9rem;line-height:1.35}
.spot-en{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.spot-i{flex:none;color:var(--muted);font-size:.9rem}
.spot-panel{margin-top:6px;padding:12px;border-radius:11px;background:var(--card);font-size:.88rem;line-height:1.75;color:var(--ink-body)}
.spot-panel[hidden]{display:none}
.spot-fig{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;margin-bottom:10px;background:var(--paper-strong)}

/* 餐廳卡片 */
.eatery{margin-top:12px;overflow:hidden;border:1px solid var(--edge-gold);border-radius:14px;background:var(--eatery-bg)}
.eatery-fig{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--paper-strong)}
.eatery-body{padding:13px 14px 14px}
.eatery-name{font-family:var(--serif);font-size:1.12rem;line-height:1.3;color:var(--ink)}
.eatery-en{display:block;margin-top:2px;font-family:"DM Sans","Noto Sans TC",sans-serif;font-size:.74rem;color:var(--muted)}
.eatery-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.eatery-meta span{padding:4px 9px;border-radius:999px;font-size:.72rem;font-weight:600;color:var(--gold-ink);background:var(--gold-soft)}
.eatery-meta span.hr{color:var(--teal);background:var(--teal-soft)}
.eatery-d{margin-top:9px;font-size:.88rem;line-height:1.75}
.eatery-dish{margin-top:12px;padding-top:10px;border-top:1px dashed var(--edge-gold)}
.eatery-dish>b{display:block;margin-bottom:4px;font-size:.7rem;letter-spacing:.14em;color:var(--terra)}
.eatery-dish ul{margin:0;padding:0;list-style:none}
.eatery-dish li{display:flex;gap:8px;margin-top:6px;font-size:.88rem;line-height:1.55;color:var(--ink)}
.eatery-dish li span{flex:none}
.eatery-dish li b{font-weight:700;color:var(--teal)}
.eatery-dish li i{font-style:normal;color:var(--muted);font-size:.82rem}

/* Google Maps 路線 */
.tl-map{display:inline-flex;align-items:center;gap:5px;padding:4px 9px 4px 7px;border-radius:999px;font-size:.72rem;font-weight:600;line-height:1.3;text-decoration:none;color:#fff;background:var(--teal)}
.tl-map svg{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tl-map.walk{color:var(--teal);background:var(--teal-soft)}
.tl-map.pin{color:var(--gold-ink);background:var(--gold-soft)}

/* 住宿 */
.stay{margin-top:26px;padding:17px 19px;border-radius:18px;color:var(--on-dark);background:var(--teal)}
.stay-row{display:flex;align-items:flex-start;gap:12px}
.stay-fig{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:13px;margin-bottom:14px}
.stay svg{flex:none;width:20px;height:20px;margin-top:2px;fill:none;stroke:var(--stroke);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stay small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.16em;color:var(--stroke)}
.stay b{display:block;margin-top:3px;font-size:1.02rem;font-weight:600}
.stay span{display:block;margin-top:3px;font-size:.82rem;line-height:1.55;color:rgba(255,255,255,.66)}

.dp-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.dp-nav button{flex:1;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:transparent;cursor:pointer;text-align:left;transition:.2s ease}
.dp-nav button:last-child{text-align:right}
.dp-nav button:hover:not(:disabled){border-color:var(--teal)}
.dp-nav button:disabled{visibility:hidden}
.dp-nav small{font-size:.68rem;font-weight:700;letter-spacing:.12em;color:var(--terra)}
.dp-nav span{font-size:.85rem;font-weight:600}

/* ---------- 訂單看板 ---------- */
.board-heading{align-items:center}
.filter-group{display:flex;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.42)}
.filter{padding:8px 13px;border:0;border-radius:999px;color:var(--muted);background:transparent;cursor:pointer;font-size:.78rem;white-space:nowrap}
.filter.active{color:#fff;background:var(--teal)}
.booking-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.booking-card{min-height:190px;padding:19px;border:1px solid var(--line);border-radius:18px;background:rgba(255,253,248,.82);transition:transform .2s ease}
/* 嵌在行程列裡的訂單卡：不要最小高度、不要 hover 浮起 */
.booking-card.inl{min-height:0;margin-top:13px;background:rgba(255,253,248,.95)}
.booking-card.inl:hover{transform:none}
.booking-card.inl h3{margin:9px 0 5px;font-size:.98rem}
.booking-card:hover{transform:translateY(-3px)}
.booking-card.hidden{display:none}
.card-top{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px}
/* 看板卡：日期獨佔一行（維持原本的直式版面）；嵌入版則三者並成一條 */
.card-top .card-meta{order:3;flex-basis:100%;margin:6px 0 0}
.card-top .card-icon{margin-left:auto}
.booking-card.inl .card-top .card-meta{order:0;flex-basis:auto;margin:0}
.booking-card.inl .card-top .card-icon{margin-left:auto}
.card-tag{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.67rem;font-weight:700}
.card-tag.c-stay{color:var(--teal);background:var(--teal-soft)}
.card-tag.c-fly,.card-tag.c-ride{color:var(--gold-ink);background:var(--gold-soft)}
.card-tag.c-car{color:var(--terra-ink);background:var(--terra-soft)}
.card-tag.c-other{color:#fff;background:var(--teal)}
.card-todo{margin-right:auto;padding:4px 8px;border:1px dashed rgba(191,98,68,.55);border-radius:999px;font-size:.66rem;font-weight:700;color:var(--terra-ink)}
.card-icon{font-size:1.2rem;color:var(--muted)}
.card-meta{margin:12px 0 0;color:var(--terra);font-size:.68rem;font-weight:700;letter-spacing:.12em}
.booking-card h3{margin:14px 0 6px;font-size:1.05rem;line-height:1.35}
.booking-card .ci{margin:0;font-size:.85rem;line-height:1.6;color:var(--ink)}
.booking-card .ce{margin:8px 0 0;font-size:.78rem;line-height:1.6;color:var(--muted)}
.booking-card .ce-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:4px 14px;margin:9px 0 0;padding:0;list-style:none}
.booking-card .ce-list li{display:flex;align-items:flex-start;gap:6px;font-size:.78rem;line-height:1.5;color:var(--muted)}
.booking-card .ce-list svg{flex:none;width:13px;height:13px;margin-top:3px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
.booking-card em,.booking-card .ci em{font-style:normal;font-weight:700;color:var(--terra-ink)}
.booking-card .cw{margin:8px 0 0;padding:7px 9px;border-radius:9px;font-size:.76rem;line-height:1.5;color:var(--terra-ink);background:var(--terra-soft)}

/* ---------- 鎖定畫面 ---------- */
#lock{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(125deg,var(--hero-a),var(--hero-b)),var(--teal)}
#lock form{width:min(360px,100%);text-align:center;color:var(--on-dark)}
.lock-k{font-size:.72rem;font-weight:700;letter-spacing:.22em;color:var(--kicker)}
.lock-t{margin:12px 0 0;font-family:var(--serif);font-weight:500;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.25;letter-spacing:-.02em}
.lock-s{margin:9px 0 26px;color:rgba(255,255,255,.66);font-size:.88rem}
#lockPw{width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,.26);border-radius:13px;
  background:rgba(255,255,255,.1);color:var(--on-dark);font:inherit;font-size:1rem;text-align:center;letter-spacing:.12em}
#lockPw::placeholder{color:rgba(255,255,255,.42);letter-spacing:normal}
#lockPw:focus{outline:0;border-color:var(--stroke);background:rgba(255,255,255,.16)}
.lock-r{display:flex;align-items:center;justify-content:center;gap:7px;margin:14px 0 0;color:rgba(255,255,255,.62);font-size:.8rem;cursor:pointer}
.lock-r input{accent-color:var(--stroke);width:15px;height:15px}
#lockGo{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:var(--stroke);color:#3a2419;
  font-weight:700;font-size:.95rem;cursor:pointer}
#lockGo:disabled{opacity:.6;cursor:default}
.lock-e{margin:14px 0 0;color:var(--pill-on);font-size:.84rem}
.lock-e[hidden]{display:none}

/* ---------- 現金預算 ---------- */
.cash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.cash-card{padding:19px;border:1px solid var(--line);border-radius:18px;background:rgba(255,253,248,.82)}
.cash-card h3{margin:0;font-size:1.02rem;line-height:1.35}
.cash-leg{margin:5px 0 13px;color:var(--muted);font-size:.78rem;line-height:1.5}
.cash-tbl{width:100%;border-collapse:collapse;font-size:.86rem;line-height:1.5}
.cash-tbl td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.cash-tbl td+td{padding-left:10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cash-tbl tr.big td{font-weight:700}
.cash-tbl tr.tot td{border-bottom:0;padding-top:11px;font-weight:700;font-size:.95rem}
.cash-tbl i{display:block;font-style:normal;margin-top:2px;color:var(--muted);font-size:.76rem}
.cash-sum{margin-top:14px;padding:17px 19px;border-radius:18px;color:var(--on-dark);background:var(--teal)}
.cash-sum b{display:block;font-size:1.25rem;letter-spacing:-.01em}
.cash-sum small{display:block;margin-top:4px;color:rgba(255,255,255,.7);font-size:.8rem}
.cash-plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 18px;margin:13px 0 0;padding:0;list-style:none}
.cash-plan li{font-size:.8rem;line-height:1.6;color:rgba(255,255,255,.82)}
.cash-plan li b{margin-right:6px;font-size:.8rem;color:var(--on-dark)}
.cash-note{margin:14px 0 0;color:var(--muted);font-size:.78rem;line-height:1.7}
.cash-note b{color:var(--teal)}

/* ---------- footer ---------- */
footer{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:28px 0 calc(var(--safe-b) + 42px);border-top:1px solid var(--line);color:var(--muted);font-size:.75rem;line-height:1.7}
footer p{margin:0;max-width:720px}
footer p+p{margin-top:8px}
footer b{color:var(--teal);letter-spacing:.14em}
footer code{font-size:.72rem}
footer button{flex:none;border:0;background:none;color:var(--teal);font-weight:700;cursor:pointer}

.now-fab{
  position:fixed;right:16px;bottom:calc(var(--safe-b) + 18px);z-index:60;display:inline-flex;align-items:center;gap:8px;
  padding:12px 16px;border:0;border-radius:999px;color:#fff;background:var(--terra);font-weight:700;font-size:.85rem;
  box-shadow:0 10px 26px rgba(191,98,68,.35);cursor:pointer;
}
.now-fab::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.9s ease-out infinite}
.now-fab[hidden]{display:none}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(191,98,68,.5)}70%{box-shadow:0 0 0 8px rgba(191,98,68,0)}100%{box-shadow:0 0 0 0 rgba(191,98,68,0)}}
@keyframes ring{0%{box-shadow:0 0 0 1px var(--terra),0 0 0 0 rgba(191,98,68,.45)}70%{box-shadow:0 0 0 1px var(--terra),0 0 0 9px rgba(191,98,68,0)}100%{box-shadow:0 0 0 1px var(--terra),0 0 0 0 rgba(191,98,68,0)}}

@media (min-width:821px){
  .day-hero img{aspect-ratio:21/9}
}
@media (max-width:820px){
  .page-shell{width:min(100% - 22px,720px)}
  .hero{min-height:480px;padding:25px 22px 22px;border-radius:22px}
  /* 手機：字疊在照片下半部，漸層改成由上往下加深 */
  .hero{background:
    linear-gradient(180deg,var(--shade-3) 0%,var(--shade-2) 45%,var(--shade-1) 100%),
    url('../img/turkey-cover.jpg') center 52%/cover no-repeat,
    linear-gradient(125deg,var(--hero-a),var(--hero-b))}
  .hero-copy{align-items:start;flex-direction:column;margin-top:150px}
  .hero-stats{width:100%;grid-template-columns:repeat(4,1fr)}
  .hero-stats button{min-width:0;padding-inline:6px}
  .route-line{margin-top:34px;gap:6px;font-size:.68rem}
  main{padding-top:58px}
  section+section{margin-top:70px}
  .booking-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cash-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .page-shell{width:min(100% - 16px,520px)}
  .hero{margin-top:10px;min-height:0}
  .hero-topline .eyebrow{max-width:150px;line-height:1.4}
  .hero-copy{margin-top:170px;gap:24px}
  h1{font-size:clamp(2.3rem,11vw,3.3rem)}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .hero-stats button{min-height:52px}
  .route-line{overflow-x:auto;scrollbar-width:none}
  .route-line::-webkit-scrollbar{display:none}
  .route-line i{min-width:14px}
  .section-heading{align-items:start;flex-direction:column;margin-bottom:20px}
  .legend{align-self:flex-end;margin-top:-35px}
  .date-rail-wrap{grid-template-columns:36px minmax(0,1fr) 36px;gap:4px;margin-inline:-4px}
  .rail-arrow{width:36px;height:36px}
  .date-tab{flex-basis:72px;padding:10px 6px}
  .dp{padding:20px 14px;border-radius:19px}
  .dp-head{grid-template-columns:1fr;gap:14px}
  .note-box{min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
  .note-box .stars{margin-top:0}
  .note-box small{margin-top:0}
  .dp-meta{margin-top:0;width:100%}
  .day-hero{margin-top:18px;border-radius:14px}
  /* 時間軸左欄：時間 37px ＋ 20px 的線／圓章區，卡片從 57px 開始（桌機是 82px）。
     圓章縮到 17px 才塞得進那 20px，而且兩側都還留得出空隙。 */
  /* 手機版：時間欄不再佔左邊一整欄，改成「交通圓章＋時間」一行放在卡片上方。
     色條留在最左邊 4px 一路貫通（卡片只讓出這 10px），圓章騎在色條上，
     線不會斷；卡片吃掉剩下的全部寬度。 */
  .grp-head{margin-left:14px}
  .tl::before{display:none}            /* 每一列都有色條，底下那條細線就多餘了 */
  .tl-row{display:block;position:relative;padding-left:14px}
  :root{--row-display:block}
  .tl-row[data-way]::before{left:7px;top:0;bottom:-12px;width:4px}
  .tl-time{
    position:relative;padding:0 0 7px 10px;
    text-align:left;font-size:.7rem;line-height:1.35;
  }
  .tl-time br{display:none}            /* 「05:50 / –13:20」併成一行 */
  /* 圓章從卡片移到時間那一行；這三個選擇器要跟原本的規則同樣明確才蓋得掉 */
  .tl-card::before,
  .tl-row[data-way]:not([data-way="stay"]) .tl-card::before,
  .tl-row[data-mark] .tl-card::before{display:none}
  .tl-time::before{
    content:"";position:absolute;left:-14px;top:-1.5px;
    box-sizing:border-box;display:flex;align-items:center;justify-content:center;
    width:18px;height:18px;border:2px solid var(--card);border-radius:50%;
    background:var(--card);font-size:10px;line-height:1;box-shadow:0 0 0 1.5px var(--dot);
  }
  .tl-row[data-way="fly"] .tl-time::before{content:"\2708\FE0F";box-shadow:0 0 0 1.5px var(--fly)}
  .tl-row[data-way="drive"] .tl-time::before{content:"\1F698";box-shadow:0 0 0 1.5px var(--terra)}
  .tl-row[data-way="walk"] .tl-time::before{content:"\1F6B6";box-shadow:0 0 0 1.5px var(--gold)}
  .tl-row[data-way="transit"] .tl-time::before{content:"\1F68B";box-shadow:0 0 0 1.5px var(--teal)}
  .tl-row[data-mark="hotel"] .tl-time::before{content:"\1F3E8"}
  .tl-row[data-mark="eat"] .tl-time::before{content:"\1F37D\FE0F"}
  .tl-row[data-mark="sight"] .tl-time::before{content:"\1F4CD"}
  /* 「現在進行中」的圓章也跟著搬過來 */
  .tl-row.now .tl-time::before{background:var(--terra);animation:ring 1.9s ease-out infinite}
  .tl-row.now.up .tl-time::before{animation:none;background:var(--card)}
  .tl-row.now .tl-time::after{display:inline;margin:0 0 0 7px}
  /* 景點卡：手機改成上下排，順序是 圖片 → 說明 →（卡片外的）標籤 */
  .sightc.side{display:block}
  .sightc.side .sightc-fig{width:100%;min-width:0;max-width:none;margin-bottom:10px}
  .sightc.side .sightc-d{margin-top:0}
  .tl-sum{padding:13px 12px}
  .tl-act{font-size:.93rem}
  .tl-note{font-size:.82rem}
  .tl-body{padding-inline:12px}
  .tl-spots{margin-inline:-4px;padding:10px}
  .board-heading{align-items:start}
  .filter-group{align-self:stretch;overflow-x:auto;scrollbar-width:none}
  .filter{flex:1}
  .booking-grid{grid-template-columns:1fr}
  .booking-card{min-height:0}
  .cash-card{padding:16px 14px}
  .cash-sum{padding:15px 16px}
  .cash-plan{grid-template-columns:1fr;gap:8px}
  footer{flex-direction:column}
}
/* ---------- 底部分頁：今天 / 地圖 / 行程 ---------- */
body{padding-bottom:calc(var(--safe-b) + 66px)}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:center;gap:4px;
  padding:6px 10px calc(var(--safe-b) + 6px);border-top:1px solid var(--line);
  background:rgba(255,252,246,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.tabbar button{
  flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;
  border:0;border-radius:14px;background:none;color:var(--muted);font-size:.68rem;font-weight:600;cursor:pointer;
}
.tabbar button i{font-style:normal;font-size:1.25rem;line-height:1}
.tabbar button.on{color:var(--terra);background:var(--terra-soft)}
.now-fab{bottom:calc(var(--safe-b) + 82px)}
body[data-tab="today"] .hero,body[data-tab="today"] main,body[data-tab="today"] footer{display:none}
body:not([data-tab="today"]) #todayView{display:none}
body:not([data-tab="plan"]) .now-fab{display:none}

/* ---------- 今天 ---------- */
.tv{max-width:520px;margin:14px auto 0;padding-bottom:28px}
.tv-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tv-flag{font-size:.7rem;font-weight:700;letter-spacing:.2em;color:var(--terra)}
.tv-place{margin:4px 0 0;font-family:var(--serif);font-size:1.45rem;font-weight:normal;line-height:1.3}
.tv-step{display:flex;gap:6px;flex:none;padding-top:4px}
.tv-step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer}
.tv-step button:disabled{opacity:.35;cursor:default}
.tv-clock{margin-top:16px;font-family:var(--serif);font-size:3.3rem;line-height:1;font-variant-numeric:tabular-nums}
.tv-clock small{display:block;margin-top:8px;font-family:"DM Sans","Noto Sans TC",sans-serif;font-size:.75rem;letter-spacing:.04em;color:var(--muted)}
.tv-clock small button{margin-left:6px;border:0;background:none;padding:0;color:var(--teal);font-weight:700;cursor:pointer}
.tv-loc{margin-top:14px;font-size:.9rem;color:var(--ink-soft)}
.tv-loc button{padding:8px 14px;border:1px dashed var(--edge);border-radius:999px;background:var(--tint);color:var(--teal);font-weight:600;cursor:pointer}
.tv-next{
  margin-top:16px;padding:18px;border-radius:22px;color:var(--on-dark);box-shadow:var(--shadow);
  background:linear-gradient(135deg,var(--hero-a),var(--hero-b));
}
.tv-next small{font-size:.68rem;font-weight:700;letter-spacing:.2em;color:var(--kicker)}
.tv-next h3{margin:6px 0 4px;font-size:1.3rem;line-height:1.35}
.tv-next p{margin:0;font-size:.85rem;opacity:.88}
.tv-acts{display:flex;gap:8px;margin-top:14px}
.tv-acts a,.tv-acts button{flex:1;padding:11px 0;border-radius:14px;font-size:.9rem;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.tv-go{border:0;background:var(--on-dark);color:var(--terra)}
.tv-ok{border:1px solid rgba(253,246,236,.45);background:transparent;color:var(--on-dark)}
.tv-label{margin:24px 0 8px;font-size:.68rem;font-weight:700;letter-spacing:.2em;color:var(--muted)}
.tv-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.tv-list li{display:grid;grid-template-columns:22px 52px 1fr;gap:6px;align-items:start;padding:11px 14px;border-top:1px solid var(--line);font-size:.9rem;cursor:pointer}
.tv-list li:first-child{border-top:0}
.tv-list .m{font-weight:700;color:var(--dot)}
.tv-list .t{padding-top:2px;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tv-list li.done .a{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dot)}
.tv-list li.done .m{color:var(--teal)}
.tv-list li.focus{background:var(--terra-soft)}
.tv-list li.focus .m,.tv-list li.focus .a{color:var(--terra);font-weight:700}
.tv-book .booking-card.inl{margin-top:10px}
.tv-list li{grid-template-columns:22px 52px 1fr auto}
.bk-tg{display:inline-flex;align-items:center;gap:2px;margin:-4px -6px -4px 0;padding:4px 6px;border:1px solid var(--edge-gold);border-radius:999px;background:var(--gold-soft);font-size:.8rem;cursor:pointer}
.bk-tg .chev{width:14px;height:14px;fill:none;stroke:var(--gold-ink);stroke-width:2.2;transition:transform .2s ease}
.bk-tg.on .chev{transform:rotate(180deg)}
.tv-list li>.tv-book{grid-column:1/-1;cursor:default}
.tv-hint{margin-top:10px;font-size:.72rem;color:var(--muted);text-align:center}

.sheet{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;background:rgba(46,26,31,.42)}
.sheet[hidden]{display:none}
.sheet form{
  width:min(560px,100%);max-height:92vh;overflow-y:auto;padding:20px 18px calc(var(--safe-b) + 18px);
  border-radius:24px 24px 0 0;background:var(--paper);box-shadow:var(--shadow);
}
.sheet h3{margin:0 0 4px;font-family:var(--serif);font-size:1.3rem;font-weight:normal}
.sheet label{display:block;margin-top:16px;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.sheet input[type=text],.sheet input[type=password],.sheet select{
  width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font:inherit;font-size:16px;color:var(--ink);
}
.sheet .hint{margin:6px 0 0;font-size:.72rem;font-weight:400;color:var(--muted);line-height:1.6}
.sheet-acts{display:flex;gap:8px;margin-top:20px}
.sheet-acts button{flex:1;padding:13px 0;border-radius:14px;font-weight:700;font-size:.95rem;cursor:pointer}
.sheet-acts .cancel{border:1px solid var(--line);background:var(--card)}
.sheet-acts .save{border:0;background:var(--terra);color:#fff}
.sheet-acts .save:disabled{opacity:.6}
.sheet-err{margin:10px 0 0;font-size:.8rem;color:var(--terra)}
.priv-btn{flex:none;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink-soft);font-size:.75rem;font-weight:700;cursor:pointer}
.priv-btn.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.topbar-r{display:flex;align-items:center;gap:10px}
@media (max-width:400px){.topbar-r .topbar-title{display:none}}
body.public .hero-stats button{pointer-events:none}
body.public .trip-board{display:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>

'50% 45%', side:true,\n           d:'土耳其式早餐拼盤配屋頂露台：起司、橄欖、蜂蜜、果乾堅果、水果、現烤麵包與現榨果汁。清晨可以邊吃邊看整片熱氣球從谷地升上來。'}},\n    ]},\n    {label:'清晨 · 今天補飛', sub:'04:00 起床，白天照常走三個點', alt:true, sc:'fly', rows:[\n      {time:'04:30<br>–08:30', act:'Göreme 日出熱氣球飛行', book:'exp-balloon', hi:true, tags:['含飯店接送','茶點','香檳'],\n       sight:{zh:'格雷梅日出熱氣球', en:'Göreme Sunrise Balloon Flight', img:'balloon-ride.jpg', d:'日出前在谷地裡充氣起飛，升到岩柱群上方看整片卡帕多奇亞由暗轉亮——同一時段天上通常有上百顆球。', side:true},\n      },\n      {time:'08:30<br>–09:30', act:'飯店早餐', tags:['eat:早餐'],\n         sight:{zh:'飯店屋頂早餐', en:'Göreme 鎮中心', img:'roof-breakfast.jpg', pos:'50% 45%', side:true,\n           d:'土耳其式早餐拼盤配屋頂露台：起司、橄欖、蜂蜜、果乾堅果、水果、現烤麵包與現榨果汁。清晨可以邊吃邊看整片熱氣球從谷地升上來。'}},\n    ]},\n    {label:'10:00 退房出發 · 往機場收尾', rows:[\n      {time:'10:00<br>–11:20', act:'Mustafapaşa 希臘石屋村 Sinasos', hi:true, tags:['car:🚘 19 分','停留 1h'], map:gm('mustafapasa'),\n       sight:{zh:'Mustafapaşa 希臘石屋村', en:'Sinasos', img:'mustafapasa.jpg', d:'1924 人口交換前是希臘正教社區，當時叫Sinasos。18–19 世紀在外經商致富的居民回鄉蓋了近 700 棟石造宅邸，雕花門面、拱窗、新古典立面——是「蓋」出來的，看點是聖君士坦丁與海倫娜教堂與石雕宅邸街區。', side:true},\n      },\n      {time:'11:20<br>–12:30', act:'Güray Müze 地下陶藝博物館', hi:true, tags:['car:🚘 24 分','停留 45 分'], map:gm('guray'),\n       sight:{zh:'Güray Müze 地下陶藝博物館', en:'Güray Müze', img:'guray-muze.jpg', side:true, d:'世界第一座地下陶藝博物館，分古代館（含西臺時期陶器）、現代館與藝廊，現場有製陶示範。'},\n      },\n      {time:'12:30<br>–13:05', act:'麥當勞 午餐', note:'Avanos 鎮中心。這餐求快、換換口味。', tags:['car:🚘 8 分','eat:午餐'], map:gm('mcdonalds')},\n      {time:'13:05<br>–13:45', act:'Chez Galip 頭髮博物館', hi:true, tags:['car:🚶 10 分','停留 30 分'], map:gm('chezgalip'),\n       sight:{zh:'Chez Galip 頭髮博物館', en:'Hair Museum', img:'chez-galip.jpg', side:true, d:'陶藝工坊的地下室掛滿超過 16,000 名女性的髮束，每束都附姓名地址，是卡帕多奇亞最有名的怪地方。樓上就是 Galip 的陶藝工坊，可以看拉坯。'},\n      },\n      {time:'13:45<br>–14:25', act:'Sarı Han 商隊驛站 Sarıhan Caravanserai', hi:true, tags:['car:🚘 8 分','停留 30 分'], map:gm('sarihan'),\n       sight:{zh:'Sarı Han 商隊驛站', en:'Sarıhan Caravanserai', img:'sarihan-caravanserai.jpg', d:'1249 年的塞爾柱商隊旅館，是這趟唯一的塞爾柱時期建築。', side:true},\n      },\n      {time:'14:25<br>–16:15', act:'開塞利機場 Kayseri Erkilet Airport', note:'還車、辦理登機手續。', hi:true, tags:['car:🚘 1h05'], map:gm('asr')},\n      {time:'18:40<br>–20:20', act:'國內轉機', book:'fly-tk2017'},\n      {time:'20:20<br>起', act:'飯店', book:['ride-in','stay-hotelI'], hi:true, tags:['Klook 接機 · 舉牌']}\n    ]}\n  ]\n},\n\n\n{\n  day:6, date:'11/05', week:'四', theme:'blue',\n  title:'🏛️ 舊城核心｜聖索菲亞、地下水宮殿與大巴札',\n  fatigue:2, fatigueText:'低中',\n  img:'hagia-sophia.jpg', cap:'聖索菲亞 · Sultanahmet 廣場',\n  lead:'一千五百年的巨大穹頂、藏在地面下的拜占庭蓄水池、兩萬片藍色磁磚的清真寺，還有一座蓋了五百年的室內市集——全部在飯店走得到的範圍裡。',\n  facts:['全程步行', '部分景點需包住頭髮，要帶圍巾'],\n  rows:[\n    {time:'08:20<br>–09:15', act:'藍色清真寺 Blue Mosque', hi:true, tags:['car:🚶 步行 10 分','停留 45 分','免費'], map:gm('blueMosque'),\n     sight:{zh:'藍色清真寺', en:'Sultanahmet Camii', img:'blue-mosque.jpg', d:'1616 年落成，六座宣禮塔是它最好認的特徵。內部超過兩萬片藍色伊茲尼克磁磚，「藍色清真寺」的名字就是從這裡來的。就在聖索菲亞正對面，兩座建築隔著廣場對望。', side:true},\n    },\n    {time:'09:20<br>–11:00', act:'Seven Hills Restaurant', book:'eat-sevenhills', hi:true, tags:['car:🚶 步行 5 分','eat:早餐'],\n     eatery:{name:'Seven Hills Restaurant', en:'Sultanahmet 屋頂', hours:'早餐08:30-12:00，午晚餐 12:00–23:00', img:'sevenhills-breakfast.jpg',\n       d:'屋頂正對聖索菲亞與藍色清真寺。點傳統早餐套餐 Breakfast Set Menu，一套就涵蓋下面全部，附一杯現榨果汁與無限續杯的土耳其紅茶。',\n       dishes:[\n         ['🥇','土耳其現炒烘蛋 <b>Menemen<\/b>','套餐裡最厲害的一道，滑嫩香濃，拿現烤麵包沾著吃'],\n         ['🥈','現烤麵包 4～5 款 + 在地炸物','剛出爐、麥香濃，配熱食一起上'],\n         ['🥉','土耳其在地起司拼盤 + 火腿','香氣濃郁、口感滑順，是套餐的主體之一'],\n         ['４','時令水果、沙拉、堅果','現切清甜，用來解膩'],\n         ['５','無限續杯紅茶 <b>Çay<\/b>','一口鹹點、一口甜抹醬，再一口熱紅茶']\n       ]},\n     map:gm('sevenHills')},\n    {time:'11:05<br>–12:20', act:'聖索菲亞 Hagia Sophia', book:'tkt-hagia', hi:true, tags:['car:🚶 步行 4 分','停留 1h30'], map:gm('hagia'),\n     sight:{zh:'聖索菲亞', en:'Hagia Sophia', img:'hagia-sophia-rooftop.jpg', d:'西元 537 年落成，當了九百年教堂、五百年清真寺。重點是直徑 31 公尺的巨大穹頂，以及基督教馬賽克與伊斯蘭書法圓盤在同一個空間裡並存。', side:true},\n    },\n    {time:'12:30<br>–13:50', act:'地下水宮殿 Basilica Cistern', book:'tkt-cistern', hi:true, tags:['car:🚶 步行 4 分'], map:[['在地圖上開啟 · '+PN.busforus,gm('busforus')],['在地圖上開啟 · '+PN.cistern,gm('cistern')]],\n     sight:{zh:'地下水宮殿', en:'Basilica Cistern', img:'basilica-cistern.jpg', d:'六世紀查士丁尼時期的地下蓄水池，336 根柱子撐起整個空間，底部有兩顆倒置與側放的梅杜莎頭像。地面永遠濕、光線很暗。', side:true},\n    },\n    {time:'13:50<br>–15:15', act:'Hafız Mustafa 1864 Beyazıt', hi:true, tags:['car:🚶 步行 15 分','eat:甜點'],\n     eatery:{name:'Hafız Mustafa 1864 Beyazıt', en:'Yeniçeriler Cd. No:39, Beyazıt · 大巴札旁', hours:'24 小時', img:'hafiz-mustafa.jpg',\n       d:'1864 年的土耳其甜點老店，Beyazıt 分店就在大巴札西側出口旁，逛完直接走過去。也有伴手禮櫃。建議兩人點法：開心果 Şöbiyet ＋ Kazandibi ＋ 兩杯紅茶，一甜一奶香，用茶解膩。',\n       dishes:[\n         ['🥇','開心果酥皮 <b>Fıstıklı Şöbiyet<\/b>','開心果版的高級酥皮甜點——外皮酥、裡面是開心果與奶油餡。比普通 baklava 更值得第一次吃，只點一樣就點這個'],\n         ['🥈','焦糖奶布丁 <b>Kazandibi<\/b>','牛奶布丁類，表面焦糖化。不想一路吃糖漿甜點就點這個，奶香為主、不會甜到爆'],\n         ['🥉','土耳其紅茶 <b>Çay<\/b>','配甜點剛好，吃完 Şöbiyet 用它解膩']\n       ]},\n     map:gm('hafiz')},\n    {time:'15:20<br>–17:30', act:'大巴札 Grand Bazaar', hi:true, tags:['car:🚶 步行 5 分','停留 2h10'], map:gm('grandBazaar'),\n     sight:{zh:'大巴札', en:'Kapalıçarşı / Grand Bazaar', img:'grand-bazaar.jpg', d:'十五世紀開始擴建的室內市集，六十幾條街、四千多家店，拱頂全部彩繪。偏工藝、金飾、地毯與觀光商品，人非常多，注意隨身物品。', side:true},\n    },\n  ]\n},\n\n\n{\n  day:7, date:'11/06', week:'五', theme:'blue',\n  title:'👑 新城軸線｜多爾瑪巴切、奧塔科伊與獨立大街',\n  fatigue:3, fatigueText:'中',\n  img:'galata-tower.jpg', cap:'加拉達塔 · 從 Karaköy 望去',\n  lead:'同一個帝國三百年後把自己蓋成歐洲的樣子——水晶吊燈與巴洛克立面取代了岩石與磁磚。一路從海邊的新皇宮走到山丘上的行人大街，最後在加拉達塔看日落。',\n  facts:['⚠️ 週五上午清真寺不開放遊客','⚠️ 多爾瑪巴切週一休'],\n  rows:[\n    {time:'08:30<br>–09:00', act:'飯店早餐', tags:['eat:早餐']},\n    {time:'09:00<br>–11:45', act:'多爾瑪巴切皇宮 Dolmabahçe Sarayı', book:'tkt-dolmabahce', hi:true, tags:['car:🚋 T1 25 分 + 步行 13 分','停留 2h'], map:[['在地圖上開啟 · '+PN.kabatas,gm('kabatas')],['在地圖上開啟 · '+PN.dolmabahce,gm('dolmabahce')]],\n     sight:{zh:'多爾瑪巴切皇宮', en:'Dolmabahçe Palace', img:'dolmabahce.jpg', d:'1856 年取代托卡比的新皇宮，巴洛克加新古典，285 個房間。看點是室內——4.5 噸的水晶吊燈（維多利亞女王贈）、水晶樓梯，以及阿塔圖克 1938 年逝世的房間，宮裡的時鐘全部停在 09:05。門票含 Selamlık、後宮與繪畫館。', side:true},\n    },\n    {time:'11:45<br>–13:30', act:'奧塔科伊清真寺 Büyük Mecidiye Camii', hi:true, tags:['car:🚶 36 分','eat:午餐','停留 1h25', '免費'], map:gm('ortakoy'),\n     sight:{zh:'奧塔科伊清真寺', en:'Büyük Mecidiye Camii', img:'ortakoy.jpg', d:'1856 年的海濱清真寺，站在廣場上可以把清真寺與博斯普魯斯大橋放進同一個畫面，是伊斯坦堡最好認的構圖之一。', side:true},\n    },\n    {time:'13:30<br>–13:55', act:'塔克辛廣場 Taksim', tags:['car:🚌 25 分'], map:gm('taksim')},\n    {time:'13:55<br>–14:20', act:'塔克辛廣場 Taksim Meydanı', hi:true, tags:['car:🚶 2 分','停留 25 分'],\n     sight:{zh:'塔克辛廣場', en:'Taksim Meydanı', img:'taksim.jpg', side:true, d:'新城區的中心廣場，中央是 1928 年的共和國紀念碑。獨立大街的北端起點，紅色古董電車從這裡發車。'},\n    },\n    {time:'14:20<br>–14:45', act:'Islak 濕漢堡 Kızılkayalar', tags:['car:🚶 2 分','eat:小吃'], map:gm('kizil'),\n     sight:{zh:'Islak 濕漢堡', en:'Kızılkayalar Taksim', img:'kizilkayalar.jpg', side:true, d:'塔克辛廣場旁的老牌小店，招牌是 ıslak hamburger（濕漢堡）——小顆牛肉堡泡在番茄大蒜醬汁裡，擺在冒著蒸氣的玻璃櫃中保溫，麵包吸飽醬汁變得軟濕。是塔克辛的深夜名物。'},\n    },\n    {time:'14:45<br>–15:15', act:'Suat Usta Mersin Tantuni', tags:['car:🚶 5 分','eat:小吃','彈性可刪減', '愛莉莎莎推薦'], map:gm('suat'),\n     sight:{zh:'土耳其沙威瑪 Suat Usta', en:'愛莉莎莎推薦', img:'suat-usta.jpg', side:true, d:'tantuni 是把細切牛肉或雞肉在熱鐵板上快炒後捲進薄餅，配洋蔥、番茄與香料。'},\n    },\n    {time:'14:45<br>–15:15', act:'Zübeyir Ocakbaşı 炭火烤肉', tags:['car:🚶 3 分','eat:小吃','彈性可刪減','跟 Suat Usta 二選一'], map:gm('zubeyir'),\n     sight:{zh:'Zübeyir Ocakbaşı', en:'Bekar Sk. 28, Beyoğlu', img:'zubeyir-ocakbasi.jpg', side:true, d:'Ocakbaşı 是「炭爐邊」的意思，師傅在炭爐前現烤肉串。點：烤雞翅 Kanat、烤鵪鶉 Bıldırcın（配炭烤番茄與青椒），還吃得下再加 Adana Kebap 辣味碎肉串。'},\n    },\n    {time:'15:15<br>–16:00', act:'獨立大街 İstiklal Caddesi', hi:true, tags:['car:🚶 步行 1.6 km'], map:gm('tunel'),\n     sight:{zh:'獨立大街', en:'İstiklal Caddesi', img:'istiklal.jpg', side:true, d:'1.6 公里全程行人徒步區，兩旁是十九世紀的使館與商行建築、書店、唱片行、甜點店。'},\n    },\n    {time:'16:00<br>–16:25', act:'花市拱廊 Çiçek Pasajı', hi:true, tags:['car:🚶 沿獨立大街','停留 25 分'],\n     sight:{zh:'花市拱廊', en:'Çiçek Pasajı', img:'cicek-pasaji.jpg', side:true, d:'1876 年的新巴洛克拱廊，玻璃屋頂下兩排餐館。名字來自 1917 年後在這裡賣花的白俄移民女性。'},\n    },\n    {time:'16:25<br>–16:50', act:'聖安東尼教堂 Aziz Antuan', hi:true, tags:['car:🚶 5 分','停留 25 分','免費'],\n     sight:{zh:'聖安東尼教堂', en:'Aziz Antuan Bazilikası', img:'st-antoine.jpg', side:true, d:'1912 年落成，伊斯坦堡最大的天主教堂，義大利新哥德式紅磚建築，退縮在街面後方的小中庭裡。免費進入，是這條街上最安靜的地方。'},\n    },\n    {time:'16:50<br>–17:10', act:'Hasan Fehmi Özsüt 1915', tags:['car:🚶 6 分','eat:甜點','彈性可刪減'], map:gm('ozsut'),\n     sight:{zh:'Hasan Fehmi Özsüt 1915', en:'İstiklal Cd. 261, Beyoğlu', img:'ozsut-1915.jpg', side:true, d:'1915 年創立的乳品甜點老店，在獨立大街南段、往加拉達塔的路上。點：蜂蜜 Kaymak 配麵包，加一杯牛奶。'},\n    },\n    {time:'17:10<br>–17:45', act:'加拉達塔 Galata Tower', hi:true, tags:['car:🚶 5 分','停留 35 分','⚠️ 只在外面拍照'], map:gm('galata'),\n     sight:{zh:'加拉達塔', en:'Galata Tower', img:'galata-tower-street.jpg', side:true, d:'1348 年熱那亞人蓋的瞭望塔，最好的角度是從塔南側那幾條彩色老屋的窄巷往上看，塔會整個框在街道盡頭。'},\n    },\n    {time:'17:45<br>–18:45', act:'烤魚捲餅 Balık Dürümcü', tags:['car:🚶 8 分','eat:小吃','彈性可刪減','⚠️ 需排隊一小時', '愛莉莎莎推薦'], map:gm('balik'),\n     sight:{zh:'土耳其烤魚捲餅', en:'Balık Dürümcü Mehmet Usta · 愛莉莎莎推薦', img:'balik-durum.jpg', side:true, d:'Karaköy 的烤鯖魚捲餅，街頭名物。'},\n    },\n    {time:'18:45<br>–19:20', act:'加拉達橋 Galata Köprüsü', note:'走到 Eminönü 搭 T1 回飯店。', hi:true, tags:['car:🚶 步行 10 分'], map:gm('eminonu'),\n     sight:{zh:'加拉達橋', en:'Galata Köprüsü', img:'galata-bridge.jpg', side:true, d:'橫跨金角灣的雙層橋——上層走人與電車、橋欄邊整排釣客，下層是一整排亮著霓虹的餐廳與茶館。這個時間走過去，對岸舊城的清真寺剪影、橋下的燈與水面反光會同時出現。'},\n    },\n  ]\n},\n\n\n{\n  day:8, date:'11/07', week:'六', theme:'blue',\n  title:'🚢 博斯普魯斯｜從水上看一次伊斯坦堡',\n  fatigue:2, fatigueText:'低中',\n  img:'bosphorus-sunset.jpg', cap:'博斯普魯斯日落 · 奧塔科伊、大橋與少女塔',\n  lead:'上午在十五世紀的浴場泡掉前八天的路，下午逛香料市集，傍晚上船——昨天在岸上走過的多爾瑪巴切與奧塔科伊，今天從水上再看一次，而且是天色轉換的那兩小時。',\n  facts:['⚠️ 部分店家只收現金','遊船 2 小時', '⚠️ 線上報到 TK124'],\n  rows:[\n    {time:'10:00<br>–11:30', act:'Boris\\'in Yeri 土耳其早餐', hi:true, tags:['car:🚶 步行 30 分','eat:早餐','⚠️ 只收現金', '愛莉莎莎推薦'], map:gm('boris'),\n     eatery:{name:'Boris\\'in Yeri', en:'Kumkapı / Fatih', img:'boris-kahvalti.jpg', hours:'06:30–21:00', price:'只收現金，備足里拉', d:'1936 年由 Boris Bey 開的老早餐店，近百年沒換過樣子。招牌是<strong>水牛奶 kaymak 淋蜂蜜配麵包<\/strong>，其餘點餐參考：menemen 番茄炒蛋、sucuk 臘腸蛋、土耳其咖啡。'}},\n    {time:'12:00<br>–13:25', act:'Acemoğlu 土耳其浴 Acemoğlu Hamamı', book:'exp-hamam', hi:true, tags:['car:🚶 步行 20 分', '停留 1h25 · 療程 45 分'], map:gm('hamam'),\n     sight:{zh:'Acemoğlu 土耳其浴', en:'Acemoğlu Hamamı · 15 世紀', img:'acemoglu-hamam.jpg', d:'征服者穆罕默德二世時期蓋的浴場，原本是給禁衛軍見習生（Acemi Oğlanlar）用的，十五世紀的石作保留至今。', side:true},\n    },\n    {time:'13:35<br>–14:05', act:'Vefa Bozacısı', tags:['car:🚶 步行 6 分','eat:小點'],\n     eatery:{name:'Vefa Bozacısı 1876', en:'Vefa, Fatih', img:'vefa-bozacisi.jpg', price:'平價，備現金', d:'它創立於 1876 年，店內保留著很有年代感的傳統裝潢。這裡不是一般咖啡廳，而是專門品嚐土耳其傳統飲品、體驗當地飲食文化的老店。'},\n     map:gm('vefa')},\n    {time:'14:25<br>–15:55', act:'香料市集 Spice Bazaar', hi:true, tags:['car:🚋 T1 20 分','停留 1h30'], map:gm('spice'),\n     sight:{zh:'香料市集', en:'Mısır Çarşısı / Spice Bazaar', img:'spice-bazaar.jpg', d:'1664 年落成的 L 形拱頂市集，本來是用埃及進口貨的關稅蓋起來的，所以土耳其文叫「埃及市集」。香料、乾果、軟糖與茶葉為主，規模比大巴札小很多，逛起來輕鬆。', side:true},\n    },\n    {time:'15:55<br>–19:00', act:'博斯普魯斯日落遊船 Sunset Cruise', book:'exp-cruise', hi:true, tags:['car:🚋 T1 到 Kabataş 25 分', '停留 2h'], map:[['在地圖上開啟 · '+PN.kabatasPier,gm('kabatasPier')],['在地圖上開啟 · '+PN.karakoyPier,gm('karakoyPier')]],\n     sight:{zh:'博斯普魯斯日落遊船', en:'Sunset Bosphorus Cruise · 17:00 開船', img:'sunset-cruise.jpg', d:'從 Kabataş出發沿歐洲岸北上，經過多爾瑪巴切皇宮、奧塔科伊清真寺、魯梅利堡壘，在第二大橋（FSM）折返，沿亞洲岸南下經少女塔，最後停靠 Karaköy。', side:true},\n    },\n    {time:'19:00', act:'線上報到 TK124', note:'隔天 17:15 IST→TPE。'},\n    {time:'20:00<br>–21:40', act:'Olden 1772 晚餐', book:'eat-olden', hi:true, tags:['car:🚶 步行 13 分','eat:晚餐'],\n     eatery:{name:'Olden 1772', en:'Sirkeci / Fatih', img:'olden-1772.jpg', hours:'約 09:00–01:00', price:'兩人約 ₺6,800（≈NT$4,400）＋10% 服務費', d:'1772 年的 Muhsinzade Han 客棧改建，挑高中庭配水晶吊燈。', dishes:[['🥇','<b>Kuzu Ön Kol<\/b> 慢烤羊肩','這道是兩人份，不用一人各點一份主餐'],['🥈','<b>Levrek Ceviche<\/b> 鱸魚醃生魚','冷前菜，鱸魚配紅洋蔥與石榴柑橘醬，兩人分一份'],['🥉','甜點現場看','菜單上的甜點不固定，點完主餐再問']]},\n     map:gm('olden')},\n  ]\n},\n\n\n{\n  day:9, date:'11/08', week:'日', theme:'terra',\n  title:'🛍️ 最後半天｜早餐、伴手禮採買 → 回程',\n  fatigue:1, fatigueText:'低',\n  lead:'慢慢吃一頓早餐，去超市把伴手禮買齊，回飯店把東西塞進行李。',\n  facts:['全程步行','機場接送'],\n  sw:{label:'上午', def:'sul', opts:[\n    {k:'sul',     t:'清真寺'},\n    {k:'topkapi', t:'皇宮'},\n    {k:'gulhane', t:'公園'}\n  ]},\n  sw2:{label:'午餐', def:'kofte', opts:[\n    {k:'kofte', t:'當地特色小吃'},\n    {k:'poika', t:'早午餐'}\n  ]},\n  groups:[\n    {label:'上午', sub:'用上面的切換鈕選版本', rows:[\n      {time:'08:00<br>–08:45', act:'飯店早餐、退房', note:'提早退房，行李寄放櫃台', tags:['eat:早餐']},\n      \n      {time:'08:45<br>–09:50', act:'蘇萊曼尼耶清真寺 Süleymaniye', sc:'sul', hi:true, tags:['car:🚶 22 分','停留 40 分','免費', '女性需包頭巾'], map:gm('suleymaniye'),\n       sight:{zh:'蘇萊曼尼耶清真寺', en:'Süleymaniye Camii · 1557', img:'suleymaniye.jpg', side:true, d:'米馬爾·錫南為蘇萊曼大帝蓋的，是伊斯坦堡最大的清真寺。蓋在第三座山丘上，中庭外緣就能俯瞰金角灣與對岸的加拉達塔。四根宣禮塔、十根陽台，代表他是鄂圖曼第四位、建國後第十位蘇丹。'},\n      },\n      {time:'10:05<br>–10:25', act:'魯斯坦帕夏清真寺 Rüstem Paşa', sc:'sul', hi:true, tags:['car:🚶 13 分 · 下坡','停留 20 分','免費'], map:gm('rustempasa'),\n       sight:{zh:'魯斯坦帕夏清真寺', en:'Rüstem Paşa Camii · 1563', img:'rustem-pasa.jpg', side:true, d:'錫南的小作品，藏在 Hasırcılar 市集街的二樓。裡面整面牆都是伊茲尼克磁磚，密度是全伊斯坦堡最高的，比藍色清真寺更集中。從街上看完全看不出來，要找樓梯上去。'},\n      },\n      {time:'10:25<br>–10:40', act:'Hasırcılar 街 · Tahtakale 市集街', sc:'sul', tags:['car:🚶 14 分'], map:gm('rustempasa'),\n       sight:{zh:'Hasırcılar 街', en:'Tahtakale 市集街', img:'hasircilar.jpg', side:true, d:'本地人的五金、咖啡磨豆、乾貨與廚具街，拱頂下兩排老店，跟香料市集完全不同的氣味。魯斯坦帕夏就在這條街的樓上。順著走就到餐廳。'},\n      },\n\n      \n      {time:'08:45<br>–11:30', act:'托卡匹皇宮 Topkapı Sarayı', sc:'topkapi', hi:true, tags:['car:🚶 7 分','停留 2h30','現場買票 ₺2,750'], map:gm('topkapi'),\n       sight:{zh:'托卡匹皇宮', en:'Topkapı Sarayı Müzesi · 1465–1856', img:'topkapi-palace.jpg', side:true, d:'鄂圖曼帝國的權力中心，不是一棟建築而是四進庭院組成的園區：後宮、寶物館（托卡比匕首、86 克拉勺子鑽石）、聖物室。最後一進的露台同時看得到金角灣、博斯普魯斯與馬爾馬

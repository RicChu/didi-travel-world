<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f0ec">
<title>2026 京都・大阪 7 日 · 行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a1d22;
  --muted:#73666b;
  --paper:#f6f0ec;
  --paper-strong:#ebe0da;
  --card:#fffcfa;
  --teal:#3d5c4a;
  --teal-soft:#e1eae3;
  --terra:#a23e58;
  --terra-soft:#f7e1e7;
  --gold:#b98a3c;
  --gold-soft:#f5ead6;
  --gold-ink:#73541c;
  --on-dark:#fdf8ef;
  --hero-a:rgba(59,42,58,0.97);
  --hero-b:rgba(192,96,122,0.86);
  --scrim-strong:rgba(59,42,58,0.78);
  --kicker:#f7cbd6;
  --warm:#f0a3b5;
  --pill:#b98a3c;
  --ink-soft:#524549;
  --ink-body:#54484c;
  --dot:#c7bbbf;
  --bar-stay:#dacfd2;
  --fly:#3e6394;
  --stroke:#f4c6d2;
  --wash-a:rgba(162,62,88,0.1);
  --wash-b:rgba(61,92,74,0.08);
  --focus:rgba(162,62,88,0.38);
  --tint:rgba(61,92,74,0.08);
  --edge-gold:rgba(185,138,60,0.42);
  --eatery-bg:rgba(245,234,214,0.45);
  --line:rgba(46,26,31,.14);
  --shadow:0 20px 55px rgba(40,34,30,.12);
  --row-display:grid;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --serif:Georgia,"Noto Serif TC","Songti TC",serif;
  font-family:"DM Sans","Noto Sans TC","PingFang TC",sans-serif;
  color:var(--ink); background:var(--paper); font-synthesis:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0; min-width:320px; line-height:1.6; -webkit-text-size-adjust:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 87% 8%, var(--wash-a), transparent 23rem),
    radial-gradient(circle at 10% 44%, var(--wash-b), transparent 26rem),
    var(--paper);
}
button{font:inherit;color:inherit}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
strong{font-weight:700}

.page-shell{width:min(1160px,calc(100% - 32px));margin:0 auto}

/* ---------- 返回列 ---------- */
.app-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(var(--safe-t) + 14px) 0 0}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:999px;
  color:var(--teal);background:rgba(255,253,248,.7);border:1px solid var(--line);
  font-size:.85rem;font-weight:600;text-decoration:none;
}
.back-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.topbar-title{font-size:.72rem;font-weight:700;letter-spacing:.19em;color:var(--muted)}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;min-height:430px;margin-top:14px;padding:34px 42px 28px;border-radius:28px;
  color:var(--on-dark);background:linear-gradient(125deg,var(--hero-a),var(--hero-b)),var(--teal);
  box-shadow:var(--shadow);
}
.hero::before{
  content:"";position:absolute;width:420px;height:420px;right:-135px;top:-168px;
  border:1px solid rgba(255,250,241,.22);border-radius:50%;
  box-shadow:0 0 0 46px rgba(255,250,241,.04),0 0 0 92px rgba(255,250,241,.035);
}
.hero::after{
  content:"";position:absolute;width:116px;height:134px;right:86px;top:62px;opacity:.7;
  background:linear-gradient(145deg,var(--warm),var(--terra));
  clip-path:polygon(50% 0,63% 32%,98% 35%,70% 58%,79% 95%,50% 75%,21% 95%,30% 58%,2% 35%,37% 32%);
}
.hero-topline,.hero-copy,.route-line{position:relative;z-index:1}
.hero-topline{display:flex;align-items:center;justify-content:space-between;gap:16px}
.eyebrow,.section-label{font-size:.73rem;font-weight:700;letter-spacing:.19em}
.live-pill{
  display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:99px;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);font-size:.76rem;text-align:right;
}
.live-pill i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--pill)}
.hero-copy{display:flex;justify-content:space-between;align-items:end;gap:40px;margin-top:76px}
.hero-kicker{margin:0 0 11px;color:var(--kicker);font-size:.9rem;letter-spacing:.08em}
h1{margin:0;max-width:700px;font-family:var(--serif);font-weight:500;font-size:clamp(2.5rem,5.4vw,4.7rem);line-height:1.02;letter-spacing:-.04em}
.hero-who{margin:14px 0 0;color:rgba(255,250,241,.72);font-size:.85rem}
.hero-stats{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(2,minmax(75px,1fr));gap:1px;overflow:hidden;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);border-radius:16px;
}
.hero-stats div{
  display:flex;align-items:baseline;justify-content:center;gap:5px;min-width:104px;padding:14px 12px;
  color:var(--on-dark);background:var(--scrim-strong);
}
.hero-stats strong{font-size:1.4rem}
.hero-stats span{color:rgba(255,255,255,.7);font-size:.75rem}
.route-line{display:flex;align-items:center;gap:12px;margin-top:54px;color:rgba(255,255,255,.75);font-size:.82rem;white-space:nowrap}
.route-line i{flex:1;height:1px;background:rgba(255,255,255,.22)}

/* ---------- 區塊標題 ---------- */
main{padding:78px 0 44px}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
.section-label{margin:0 0 9px;color:var(--terra)}
h2{margin:0;font-family:var(--serif);font-size:clamp(2rem,4vw,3.25rem);font-weight:500;letter-spacing:-.04em}
.legend{display:flex;gap:16px;color:var(--muted);font-size:.8rem}
.legend span{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.k-sight{background:var(--teal)} .dot.k-move{background:var(--gold)} .dot.k-eat{background:var(--terra)}

/* ---------- 日期滑軌 ---------- */
.date-rail-wrap{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:10px;align-items:center}
.date-rail{position:relative;display:flex;gap:8px;overflow-x:auto;padding:5px;scrollbar-width:none;scroll-snap-type:x proximity}
.date-rail::-webkit-scrollbar{display:none}
.date-tab{
  position:relative;flex:0 0 83px;scroll-snap-align:center;padding:11px 8px;cursor:pointer;
  border:1px solid var(--line);border-radius:14px;background:rgba(255,253,248,.58);transition:.2s ease;
}
.date-tab span,.date-tab small{display:block}
.date-tab span{font-weight:700;font-size:.9rem}
.date-tab small{margin-top:3px;color:var(--muted);font-size:.7rem}
.date-tab.active{color:#fff;border-color:var(--teal);background:var(--teal);transform:translateY(-2px);box-shadow:0 10px 24px rgba(35,50,60,.2)}
.date-tab.active small{color:rgba(255,255,255,.7)}
.rail-arrow{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:transparent;cursor:pointer;transition:.2s ease}
.rail-arrow:hover:not(:disabled){color:#fff;border-color:var(--teal);background:var(--teal)}
.rail-arrow:disabled{opacity:.25;cursor:not-allowed}

/* ---------- 當日面板 ---------- */
.dp{margin-top:22px;padding:30px;border:1px solid rgba(30,42,42,.08);border-radius:24px;background:rgba(255,253,248,.88);box-shadow:var(--shadow);scroll-margin-top:16px}
.dp[hidden]{display:none}
.dp-head{padding-bottom:24px;border-bottom:1px solid var(--line)}
.day-number{color:var(--terra);font-size:.74rem;font-weight:700;letter-spacing:.16em}
.dp h3{margin:7px 0 4px;font-family:var(--serif);font-weight:500;font-size:clamp(1.55rem,3vw,2.3rem);line-height:1.2;letter-spacing:-.02em}
.dp-sub{margin:0 0 10px;color:var(--teal);font-weight:600;font-size:.95rem}
.day-summary{margin:0;color:var(--muted);line-height:1.75;font-size:.95rem}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.fact{padding:5px 10px;border-radius:999px;font-size:.75rem;font-weight:600;color:var(--teal);background:var(--teal-soft)}
.fact.warn{color:var(--terra);background:var(--terra-soft)}

/* ---------- 時間軸 ---------- */
.tl{position:relative;display:grid;gap:12px;margin:22px 0 0;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:63px;top:20px;bottom:20px;width:1px;background:var(--line)}
/* 交通方式色條：疊在時間軸那條線上，顏色由 data-way 決定 */
.tl-row[data-way]::before{content:"";position:absolute;left:61px;top:0;bottom:-12px;width:5px;border-radius:999px;
  box-shadow:0 0 0 1.5px var(--card),0 2px 5px rgba(28,40,38,.22)}
.tl-row[data-way="fly"]::before{background:var(--fly)}
.tl-row[data-way="drive"]::before{background:var(--terra)}
.tl-row[data-way="walk"]::before{background:var(--gold)}
.tl-row[data-way="transit"]::before{background:var(--teal)}
.tl-row[data-way="stay"]::before{background:var(--bar-stay)}
.tl-row{display:grid;grid-template-columns:50px minmax(0,1fr);gap:32px;position:relative}
.tl-time{padding-top:15px;color:var(--muted);font-size:.74rem;font-weight:700;line-height:1.35;text-align:right;font-variant-numeric:tabular-nums}
.tl-card{position:relative;border:1px solid var(--line);border-radius:15px;background:var(--card)}
.tl-card::before{
  content:"";position:absolute;left:-26px;top:19px;width:9px;height:9px;border:3px solid var(--card);border-radius:50%;
  background:var(--dot);box-shadow:0 0 0 1px var(--dot);
}
.tl-card.k-sight::before{background:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.tl-card.k-move::before{background:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tl-card.k-eat::before{background:var(--terra);box-shadow:0 0 0 1px var(--terra)}
/* 有交通方式的列：圓點換成帶 emoji 的圓章，外圈顏色＝該交通方式的色條顏色 */
.tl-row[data-way]:not([data-way="stay"]) .tl-card::before,
.tl-row[data-mark] .tl-card::before{
  box-sizing:border-box;left:-30px;top:15px;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--card);border-radius:50%;
  background:var(--card);font-size:11px;line-height:1;
}
.tl-row[data-mark] .tl-card::before{box-shadow:0 0 0 1.5px var(--dot)}
.tl-row[data-way="fly"] .tl-card::before{content:"\2708\FE0F";box-shadow:0 0 0 1.5px var(--fly)}
.tl-row[data-way="drive"] .tl-card::before{content:"\1F698";box-shadow:0 0 0 1.5px var(--terra)}
.tl-row[data-way="walk"] .tl-card::before{content:"\1F6B6";box-shadow:0 0 0 1.5px var(--gold)}
.tl-row[data-way="transit"] .tl-card::before{content:"\1F68B";box-shadow:0 0 0 1.5px var(--teal)}
.tl-row[data-mark="hotel"] .tl-card::before{content:"\1F3E8"}
.tl-row[data-mark="eat"] .tl-card::before{content:"\1F37D\FE0F"}
.tl-row[data-mark="sight"] .tl-card::before{content:"\1F4CD"}
.tl-sum{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px}
.tl-head{min-width:0}
.tl-act{font-weight:600;line-height:1.45}
.tl-row.hi .tl-act{font-weight:700}
.tl-side{flex:0 0 auto;display:flex;align-items:center;gap:6px;margin-top:1px}
.tl-pill{padding:5px 8px;border-radius:999px;font-size:.67rem;font-weight:700;white-space:nowrap}
.tl-pill.k-sight{color:var(--teal);background:var(--teal-soft)}
.tl-pill.k-move{color:var(--gold-ink);background:var(--gold-soft)}
.tl-pill.k-eat{color:var(--terra);background:var(--terra-soft)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tl-body>.tags:first-child{margin-top:0}
.tag{padding:4px 8px;border-radius:7px;font-size:.72rem;line-height:1.3;color:var(--ink-soft);background:var(--tint)}
.tag.car{color:var(--gold-ink);background:var(--gold-soft)}
.tag.warn{color:var(--terra);background:var(--terra-soft);font-weight:600}
.tl-body{padding:0 16px 16px;color:var(--ink-body);font-size:.92rem;line-height:1.75}
.tl-note{font-size:.84rem;line-height:1.72;color:var(--ink-body)}

/* 餐廳卡片 */
.eatery{margin-top:12px;overflow:hidden;border:1px solid var(--edge-gold);border-radius:14px;background:var(--eatery-bg)}
.tl-body>.eatery:first-child{margin-top:0}
.eatery-body{padding:13px 14px 14px}
.eatery-name{font-family:var(--serif);font-size:1.12rem;line-height:1.3;color:var(--ink)}
.eatery-en{display:block;margin-top:2px;font-family:"DM Sans","Noto Sans TC",sans-serif;font-size:.74rem;color:var(--muted)}
.eatery-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.eatery-meta span{padding:4px 9px;border-radius:999px;font-size:.72rem;font-weight:600;color:var(--gold-ink);background:var(--gold-soft)}
.eatery-meta span.hr{color:var(--teal);background:var(--teal-soft)}
.eatery-d{margin-top:9px;font-size:.88rem;line-height:1.75}

/* Google Maps */
.tl-map{display:inline-flex;align-items:center;gap:5px;padding:4px 9px 4px 7px;border-radius:999px;font-size:.72rem;font-weight:600;line-height:1.3;text-decoration:none;color:var(--gold-ink);background:var(--gold-soft)}
.tl-map svg{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 住宿 */
.stay{margin-top:26px;padding:17px 19px;border-radius:18px;color:var(--on-dark);background:var(--teal)}
.stay-row{display:flex;align-items:flex-start;gap:12px}
.stay svg{flex:none;width:20px;height:20px;margin-top:2px;fill:none;stroke:var(--stroke);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stay small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.16em;color:var(--stroke)}
.stay b{display:block;margin-top:3px;font-size:1.02rem;font-weight:600}
.stay span{display:block;margin-top:3px;font-size:.82rem;line-height:1.55;color:rgba(255,255,255,.7)}

.dp-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.dp-nav button{flex:1;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:transparent;cursor:pointer;text-align:left;transition:.2s ease}
.dp-nav button:last-child{text-align:right}
.dp-nav button:hover:not(:disabled){border-color:var(--teal)}
.dp-nav button:disabled{visibility:hidden}
.dp-nav small{font-size:.68rem;font-weight:700;letter-spacing:.12em;color:var(--terra)}
.dp-nav span{font-size:.85rem;font-weight:600}

/* ---------- footer ---------- */
footer{padding:28px 0 calc(var(--safe-b) + 42px);border-top:1px solid var(--line);color:var(--muted);font-size:.75rem;line-height:1.7}
footer p{margin:0;max-width:720px}
footer b{color:var(--teal);letter-spacing:.14em}

@media (max-width:820px){
  .page-shell{width:min(100% - 22px,720px)}
  .hero{min-height:480px;padding:25px 22px 22px;border-radius:22px}
  .hero::after{right:28px;top:76px;transform:scale(.82)}
  .hero-copy{align-items:start;flex-direction:column;margin-top:110px}
  .hero-stats{width:100%;grid-template-columns:repeat(4,1fr)}
  .hero-stats div{min-width:0;padding-inline:6px}
  .route-line{margin-top:34px;gap:6px;font-size:.68rem}
  main{padding-top:58px}
}
@media (max-width:560px){
  .page-shell{width:min(100% - 16px,520px)}
  .hero{margin-top:10px;min-height:0}
  .hero-topline .eyebrow{max-width:150px;line-height:1.4}
  .hero-copy{margin-top:96px;gap:28px}
  h1{font-size:clamp(2.3rem,11vw,3.3rem)}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .hero-stats div{min-height:52px}
  .route-line{overflow-x:auto;scrollbar-width:none}
  .route-line::-webkit-scrollbar{display:none}
  .route-line i{min-width:14px}
  .section-heading{align-items:start;flex-direction:column;margin-bottom:20px}
  .legend{align-self:flex-end;margin-top:-35px}
  .date-rail-wrap{grid-template-columns:36px minmax(0,1fr) 36px;gap:4px;margin-inline:-4px}
  .rail-arrow{width:36px;height:36px}
  .date-tab{flex-basis:72px;padding:10px 6px}
  .dp{padding:20px 14px;border-radius:19px}
  /* 手機版：時間在上、卡片滿寬；交通圓章騎在最左邊的色條上 */
  .tl::before{display:none}
  .tl-row{display:block;position:relative;padding-left:14px}
  :root{--row-display:block}
  .tl-row[data-way]::before{left:7px;top:0;bottom:-12px;width:4px}
  .tl-time{position:relative;padding:0 0 7px 10px;text-align:left;font-size:.7rem;line-height:1.35;min-height:18px}
  .tl-time br{display:none}
  .tl-card::before,
  .tl-row[data-way]:not([data-way="stay"]) .tl-card::before,
  .tl-row[data-mark] .tl-card::before{display:none}
  .tl-time::before{
    content:"";position:absolute;left:-14px;top:-1.5px;
    box-sizing:border-box;display:flex;align-items:center;justify-content:center;
    width:18px;height:18px;border:2px solid var(--card);border-radius:50%;
    background:var(--card);font-size:10px;line-height:1;box-shadow:0 0 0 1.5px var(--dot);
  }
  .tl-row[data-way="fly"] .tl-time::before{content:"\2708\FE0F";box-shadow:0 0 0 1.5px var(--fly)}
  .tl-row[data-way="drive"] .tl-time::before{content:"\1F698";box-shadow:0 0 0 1.5px var(--terra)}
  .tl-row[data-way="walk"] .tl-time::before{content:"\1F6B6";box-shadow:0 0 0 1.5px var(--gold)}
  .tl-row[data-way="transit"] .tl-time::before{content:"\1F68B";box-shadow:0 0 0 1.5px var(--teal)}
  .tl-row[data-mark="hotel"] .tl-time::before{content:"\1F3E8"}
  .tl-row[data-mark="eat"] .tl-time::before{content:"\1F37D\FE0F"}
  .tl-row[data-mark="sight"] .tl-time::before{content:"\1F4CD"}
  .tl-sum{padding:13px 12px}
  .tl-act{font-size:.93rem}
  .tl-note{font-size:.82rem}
  .tl-body{padding-inline:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="page-shell">

  <div class="app-topbar">
    <a class="back-btn" href="../index.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>所有旅程</a>
    <span class="topbar-title">KANSAI 2026</span>
  </div>

  <header class="hero">
    <div class="hero-topline">
      <span class="eyebrow">KYOTO · OSAKA · SAKURA</span>
      <span class="live-pill"><i></i><span>已完成</span></span>
    </div>
    <div class="hero-copy">
      <div>
        <p class="hero-kicker">2026.03.21 — 03.27</p>
        <h1>從宇治的抹茶，<br>走進夜櫻二條城。</h1>
        <p class="hero-who">桃園來回 · JR Pass</p>
      </div>
      <div class="hero-stats" aria-label="行程摘要">
        <div><strong>7</strong><span>天</span></div>
        <div><strong>2</strong><span>間住宿</span></div>
        <div><strong>4</strong><span>座城市</span></div>
        <div><strong>1</strong><span>場和服攝影</span></div>
      </div>
    </div>
    <div class="route-line" aria-label="旅行路線">
      <span>Kyoto</span><i></i><span>Uji</span><i></i><span>Amanohashidate</span><i></i><span>Ine</span><i></i><span>Arashiyama</span><i></i><span>Osaka</span>
    </div>
  </header>

  <main>
    <section class="planner" aria-labelledby="planner-title">
      <div class="section-heading">
        <div>
          <p class="section-label">DAILY ROUTE</p>
          <h2 id="planner-title">那天去了哪裡？</h2>
        </div>
        <div class="legend" aria-label="圖例">

function escAttr(t){
  return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function pad(v){return (v<10?'0':'')+v;}
function plain(s){return String(s).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();}
/* 標題「🏯 熊本城 Kumamoto｜城下散步」→ 主標與副標，開頭的 emoji 不放進襯線大標 */
function splitTitle(t){
  var s=String(t).replace(/^[^A-Za-z0-9一-鿿À-ɏ]+/,'').trim();
  var p=s.split('｜');
  return {main:p[0].trim(), sub:(p[1]||'').trim()};
}
function tagOf(r,prefix){
  var t=r.tags||[];
  for(var i=0;i<t.length;i++) if(t[i].indexOf(prefix)===0) return t[i].slice(prefix.length);
  return null;
}
/* 交通方式：看 car: 標籤與 act 開頭的 emoji */
var WAY=[['✈',"fly"],['🚘',"drive"],['🚖',"drive"],['🚗',"drive"],['🚐',"drive"],
         ['🚶',"walk"],['🚆',"transit"],['🚄',"transit"],['🚂',"transit"],['🚇',"transit"],
         ['🚋',"transit"],['🚌',"transit"],['🚡',"transit"],['⛴',"transit"],['🚤',"transit"]];
function wayOf(r){
  var src=(tagOf(r,'car:')||'')+' '+(r.act||'');
  for(var i=0;i<WAY.length;i++) if(src.indexOf(WAY[i][0])>-1) return WAY[i][1];
  return 'stay';
}
/* 一列可以同時是移動和景點，所以回傳陣列；圓點顏色取最後一個 */
function kindsOf(r){
  var ks=[];
  if(wayOf(r)!=='stay') ks.push('move');
  if(r.eatery||tagOf(r,'eat:')!==null) ks.push('eat');
  else if(r.hi) ks.push('sight');
  return ks;
}

}

  if(e.price||e.hours){
    h+='<div class="eatery-meta">';
    if(e.price) h+='<span>'+e.price+'</span>';
    if(e.hours) h+='<span class="hr">'+e.hours+'</span>';
    h+='</div>';
  }
  if(e.d) h+='<div class="eatery-d">'+e.d+'</div>';
  return h+'</div></div>';
}
function rowHtml(r){
  var ks=kindsOf(r), pills='';
  for(var n=0;n<ks.length;n++){
    var lab=(ks[n]==='eat')?(tagOf(r,'eat:')||PILL.eat):PILL[ks[n]];
    pills+='<span class="tl-pill k-'+ks[n]+'">'+lab+'</span>';
  }
  var k=ks.length?ks[ks.length-1]:'';
  var meta=tagsHtml(r.tags)+mapsHtml(r.map);
  var body=(r.note?'<div class="tl-note">'+r.note+'</div>':'')
    +eateryHtml(r.eatery)
    +(meta?'<span class="tags">'+meta+'</span>':'');
  var sum='<span class="tl-head"><span class="tl-act">'+r.act+'</span></span><span class="tl-side">'+pills+'</span>';
  var way=wayOf(r), mark=(way==='stay')?markOf(r):'';
  return '<li class="tl-row'+(r.hi?' hi':'')+'" data-way="'+way+'"'+(mark?' data-mark="'+mark+'"':'')+'>'
    +'<div class="tl-time">'+(r.time||'')+'</div>'
    +'<div class="tl-card'+(k?' k-'+k:'')+'"><div class="tl-sum">'+sum+'</div>'
    +(body?'<div class="tl-body">'+body+'</div>':'')+'</div></li>';
}
function panelHtml(d,idx){
  var t=splitTitle(d.title), h='';
  h+='<div class="dp-head">'
    +'<span class="day-number">'+(d.day?'DAY '+pad(d.day):'出發')+' · '+d.date+' 週'+d.week+'</span>'
    +'<h3>'+t.main+'</h3>'
    +(t.sub?'<p class="dp-sub">'+t.sub+'</p>':'')
    +(d.lead?'<p class="day-summary">'+d.lead+'</p>':'');
  if(d.facts&&d.facts.length){
    h+='<div class="facts">';
    for(var i=0;i<d.facts.length;i++)
      h+='<span class="fact'+(d.facts[i].indexOf('⚠')===0?' warn':'')+'">'+d.facts[i]+'</span>';
    h+='</div>';
  }
  h+='</div><ul class="tl">';
  for(var j=0;j<d.rows.length;j++) h+=rowHtml(d.rows[j]);
  h+='</ul>';
  if(d.stay){
    h+='<div class="stay"><div class="stay-row"><svg viewBox="0 0 24 24"><path d="M3 21h18M4 21V10l8-6 8 6v11M9 21v-6h6v6"/></svg>'
      +'<div><small>住宿</small><b>'+d.stay.name+'</b>'+(d.stay.note?'<span>'+d.stay.note+'</span>':'')+'</div></div></div>';
  }
  var prev=DATA[idx-1], next=DATA[idx+1];
  h+='<div class="dp-nav">'
    +'<button type="button" data-step="-1"'+(prev?'':' disabled')+'><small>← 前一天</small><span>'
    +(prev?prev.date+' '+splitTitle(prev.title).main:'')+'</span></button>'
    +'<button type="button" data-step="1"'+(next?'':' disabled')+'><small>後一天 →</small><span>'
    +(next?next.date+' '+splitTitle(next.title).main:'')+'</span></button>'
    +'</div>';
  return h;
}

/* ---------------- 日期滑軌與當日面板 ---------------- */
var rail=document.getElementById('dateRail');
var box=document.getElementById('dayPanels');
var prevBtn=document.getElementById('prevDay'), nextBtn=document.getElementById('nextDay');
var ACTIVE=0, KEY='kansai-day';

(function(){
  var tabs='';
  for(var i=0;i<DATA.length;i++){
    var d=DATA[i], el=document.createElement('article');
    tabs+='<button class="date-tab" type="button" role="tab" data-idx="'+i+'" aria-controls="dayPanels">'
      +'<span>'+d.date+'</span><small>週'+d.week+(d.day?' · D'+d.day:' · 出發')+'</small></button>';
    el.className='dp';
    el.hidden=true;
    el.setAttribute('data-day',d.day);
    el.innerHTML=panelHtml(d,i);
    box.appendChild(el);
  }
  rail.innerHTML=tabs;
})();

function select(i,opt){
  opt=opt||{};
  i=Math.max(0,Math.min(DATA.length-1,i));
  ACTIVE=i;
  for(var k=0;k<box.children.length;k++) box.children[k].hidden=(k!==i);
  var tabs=rail.children;
  for(var t=0;t<tabs.length;t++){
    tabs[t].classList.toggle('active',t===i);
    tabs[t].setAttribute('aria-selected',t===i?'true':'false');
  }
  var tab=tabs[i];
  var left=tab.offsetLeft-(rail.clientWidth-tab.offsetWidth)/2;
  try{ rail.scrollTo({left:left,behavior:opt.instant?'auto':'smooth'}); }catch(e){ rail.scrollLeft=left; }
  prevBtn.disabled=(i===0);
  nextBtn.disabled=(i===DATA.length-1);
  try{ localStorage.setItem(KEY,String(i)); }catch(e){}
  if(opt.toTop){
    var wrap=document.querySelector('.date-rail-wrap');
    if(wrap.getBoundingClientRect().top<0) wrap.scrollIntoView({behavior:'smooth',block:'start'});
  }
}
rail.addEventListener('click',function(e){
  var tab=e.target.closest('[data-idx]');
  if(tab) select(+tab.getAttribute('data-idx'));
});
prevBtn.addEventListener('click',function(){select(ACTIVE-1);});
nextBtn.addEventListener('click',function(){select(ACTIVE+1);});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') select(ACTIVE-1);
  if(e.key==='ArrowRight') select(ACTIVE+1);
});
box.addEventListener('click',function(e){
  var step=e.target.closest('[data-step]');
  if(step&&!step.disabled) select(ACTIVE+(+step.getAttribute('data-step')),{toTop:true});
});

/* 左右滑動切換日期 */
(function(){
  var sx=null, sy=0, st=0;
  box.addEventListener('touchstart',function(e){
    if(e.touches.length!==1){sx=null;return;}
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now();
  },{passive:true});
  box.addEventListener('touchend',function(e){
    if(sx===null) return;
    var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    sx=null;
    if(Math.abs(dx)>70&&Math.abs(dy)<Math.abs(dx)*0.5&&Date.now()-st<600){
      select(ACTIVE+(dx<0?1:-1),{toTop:true});
    }
  },{passive:true});
})();

(function(){
  var saved=0;
  try{ saved=parseInt(localStorage.getItem(KEY),10)||0; }catch(e){}
  select(saved,{instant:true});
})();
</script>
